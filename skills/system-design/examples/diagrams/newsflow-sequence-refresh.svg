<svg xmlns="http://www.w3.org/2000/svg" width="920" height="736" viewBox="0 0 920 736"
     font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#111827">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="18" font-weight="700">NewsFlow: refresh with offline fallback</text>

  <!-- participants -->
  <rect x="35" y="60" width="170" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="120" y="85" text-anchor="middle" font-weight="600">FeedViewModel</text>
  <rect x="255" y="60" width="170" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="340" y="85" text-anchor="middle" font-weight="600">NewsRepository</text>
  <rect x="475" y="60" width="170" height="40" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="560" y="85" text-anchor="middle" font-weight="600">Room</text>
  <rect x="715" y="60" width="170" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="800" y="85" text-anchor="middle" font-weight="600">NewsAPI</text>

  <!-- lifelines -->
  <g stroke="#9CA3AF" stroke-dasharray="4 4">
    <line x1="120" y1="100" x2="120" y2="620"/>
    <line x1="340" y1="100" x2="340" y2="620"/>
    <line x1="560" y1="100" x2="560" y2="620"/>
    <line x1="800" y1="100" x2="800" y2="620"/>
  </g>

  <g font-size="12" fill="#374151" stroke-linejoin="round">
    <!-- 1, 2 -->
    <line x1="120" y1="140" x2="336" y2="140" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="230" y="132" text-anchor="middle">1. loadTopHeadlines(key, page 1)</text>
    <line x1="340" y1="176" x2="556" y2="176" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="450" y="168" text-anchor="middle">2. feed_cache under 30 min old?</text>

    <!-- outer alt -->
    <rect x="20" y="196" width="880" height="368" fill="none" stroke="#6B7280"/>
    <path d="M20,196 h52 v18 l-8,8 h-44 z" fill="#F3F4F6" stroke="#6B7280"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="28" y="212" font-weight="700">alt</text>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="130" y="212">[fresh]</text>
    <line x1="556" y1="250" x2="344" y2="250" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="450" y="242" text-anchor="middle">3. cached page (fromCache = true)</text>

    <line x1="20" y1="276" x2="900" y2="276" stroke="#6B7280" stroke-dasharray="6 4"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="130" y="292">[stale, or a forced refresh]</text>
    <line x1="340" y1="316" x2="796" y2="316" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="680" y="308" text-anchor="middle">4. GET top-headlines?page=1</text>

    <!-- inner alt -->
    <rect x="236" y="332" width="652" height="220" fill="none" stroke="#6B7280"/>
    <path d="M236,332 h52 v18 l-8,8 h-44 z" fill="#F3F4F6" stroke="#6B7280"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="244" y="348" font-weight="700">alt</text>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="350" y="348">[success]</text>
    <line x1="796" y1="380" x2="344" y2="380" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="680" y="372" text-anchor="middle">5. 20 articles</text>
    <line x1="340" y1="432" x2="556" y2="432" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="450" y="410" text-anchor="middle">6. one transaction: replace this</text>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="450" y="424" text-anchor="middle">feed's rows, upsert articles</text>

    <line x1="236" y1="456" x2="888" y2="456" stroke="#6B7280" stroke-dasharray="6 4"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="244" y="472">[failure]</text>
    <line x1="796" y1="496" x2="344" y2="496" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="680" y="488" text-anchor="middle">7. error, 429, or no network</text>
    <line x1="340" y1="532" x2="124" y2="532" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="180" y="524" text-anchor="middle">8. domain failure</text>

    <!-- 9 -->
    <line x1="560" y1="596" x2="124" y2="596" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <rect x="186" y="575" width="308" height="18" fill="#FFFFFF"/>
    <text stroke="#FFFFFF" stroke-width="4" paint-order="stroke" x="340" y="588" text-anchor="middle">9. observeFeed emits; favorites join in at read time</text>
  </g>

  <!-- rule -->
  <rect x="20" y="640" width="880" height="74" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="36" y="663" font-size="13" font-weight="700">Rule that keeps it correct</text>
  <text x="36" y="683" font-size="13" fill="#374151">A refresh deletes only this feed's rows in feed_articles. Favorites live in their own table,</text>
  <text x="36" y="702" font-size="13" fill="#374151">so no refresh erases them. On failure, the cached feed stays on screen.</text>
</svg>
